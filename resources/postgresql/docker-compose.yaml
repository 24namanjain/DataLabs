services:
  postgres:
    image: postgres:16-alpine
    container_name: datalabs-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: datalabs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - datalabs-postgres-network

networks:
  datalabs-postgres-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
