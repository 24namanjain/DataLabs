services:
  redis:
    image: redis:7.2-alpine
    container_name: datalabs-redis
    restart: always
    command: redis-server --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - datalabs-redis-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: datalabs-redisinsight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - datalabs-redis-network
    depends_on:
      - redis

networks:
  datalabs-redis-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  redisinsight_data:
    driver: local
